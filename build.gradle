// ###########################################################
// #### Update Gradle Wrapper:
// #### ./gradlew wrapper --gradle-version 9.7.1
// #### Update ".vfox.toml" as well
// ###########################################################

plugins {
  id "idea"
  id "jacoco"
  alias(libs.plugins.epicsoft.deps.update)
  alias(libs.plugins.dependency.check) apply false
}

group = "one.epicsoft.vc"
version = "0.1.0"

// ###########################################################
// #### Dependency updates
// #### ./gradlew checkDependencyUpdates
// ###########################################################
depsUpdate {
  showAll = true
  //// Fails the task when anything is behind — the CI job carries
  //// allow_failure, so it surfaces as a warning without stopping the pipeline.
  failOnUpdates = true
  includePreRelease = false
}

subprojects {
  apply plugin: "java"
  apply plugin: "idea"
  apply plugin: "jacoco"

  group = rootProject.group
  version = rootProject.version

  idea {
    module {
      downloadSources = true
      downloadJavadoc = true
    }
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << "-parameters"
  }

  // ###########################################################
  // #### Test — "integration" needs Docker and is skipped without it
  // ###########################################################
  tasks.named("test") {
    useJUnitPlatform {
      if (!dockerAvailable()) {
        excludeTags "integration"
      }
    }
    systemProperty "file.encoding", "UTF-8"
    testLogging.showStandardStreams = true
    testLogging.exceptionFormat = "full"
    finalizedBy("jacocoTestReport")
  }

  jacocoTestReport {
    reports {
      xml.required = true
      html.required = true
      csv.required = false
    }
  }

  // ###########################################################
  // #### OWASP dependency check — only when configured
  // ####
  // #### ./gradlew :core:dependencyCheckAnalyze
  // ####
  // #### Everything about that database comes from the environment, down to the
  // #### kind of database. Unset means the plugin is not applied at all.
  // ###########################################################
  final def depcheckUrl = System.getenv("VC_DEPCHECK_URL")
  final def depcheckDriver = System.getenv("VC_DEPCHECK_DRIVER")
  final def depcheckDriverJar = System.getenv("VC_DEPCHECK_DRIVER_JAR")
  final def depcheckUser = System.getenv("VC_DEPCHECK_USERNAME")
  final def depcheckPass = System.getenv("VC_DEPCHECK_PASSWORD")
  if (depcheckUrl && depcheckUser && depcheckPass) {
    apply plugin: "org.owasp.dependencycheck"

    // The plugin loads the JDBC driver from a jar of its own, not from the build
    // classpath — naming the class alone ends in "Analysis failed". The
    // coordinate comes from the environment, so no driver jar lives in this
    // repository and the kind of database stays out of it.
    String depcheckDriverPath = null
    if (depcheckDriverJar) {
      final def driverDependency = dependencies.create(depcheckDriverJar)
      driverDependency.transitive = false
      depcheckDriverPath = configurations.detachedConfiguration(driverDependency).singleFile.absolutePath
    }

    dependencyCheck {
      autoUpdate = false
      skipTestGroups = true
      failBuildOnCVSS = 5
      failOnError = true
      suppressionFile = "${rootDir}/dependency-suppressions.xml"
      format = "ALL"
      // Everything this project is not, plus centralEnabled: that analyzer asks
      // search.maven.org about every jar, which a runner without direct internet
      // access cannot do — and the plugin reports it as a bare "Analysis failed".
      analyzers.assemblyEnabled = false
      analyzers.retirejs.enabled = false
      analyzers.nodeEnabled = false
      analyzers.nodePackage.enabled = false
      analyzers.nodeAuditEnabled = false
      analyzers.nuspecEnabled = false
      analyzers.bundleAuditEnabled = false
      analyzers.pyPackageEnabled = false
      analyzers.pyDistributionEnabled = false
      analyzers.rubygemsEnabled = false
      analyzers.centralEnabled = false
      data.connectionString = depcheckUrl
      if (depcheckDriver) {
        data.driver = depcheckDriver
      }
      if (depcheckDriverPath) {
        data.driverPath = depcheckDriverPath
      }
      data.username = depcheckUser
      data.password = depcheckPass
      // The shared database is kept current elsewhere; this build only reads it.
      nvd.validForHours = 99999
      nvd.endpoint = ""
    }
  }

  // ###########################################################
  // #### Docker helper — the image build reads the jar name
  // ###########################################################
  tasks.register("showJarName") {
    doLast {
      println "${jar.archiveBaseName.orNull}-${jar.archiveVersion.orNull}.${jar.archiveExtension.orNull}"
    }
  }
}

/** True when a Docker daemon answers; integration tests need one. */
static boolean dockerAvailable() {
  try {
    final def process = new ProcessBuilder("docker", "info")
      .redirectErrorStream(true)
      .start()
    process.inputStream.text
    return process.waitFor() == 0
  } catch (final Exception ignored) {
    return false
  }
}
