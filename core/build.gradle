plugins {
  id "java"
  alias(libs.plugins.spring.boot)
  alias(libs.plugins.spring.dependency.management)
  alias(libs.plugins.epicsoft.tolgee)
}

description = "Version Control backend"

base {
  archivesName = "vc-core"
}

// Executable jar only. With both, "vc-core-<version>-plain.jar" sorts first and
// ends up in the image, which then dies with "no main manifest attribute".
tasks.named("jar") {
  enabled = false
}

java {
  sourceCompatibility = JavaVersion.VERSION_25
  targetCompatibility = JavaVersion.VERSION_25
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

dependencies {
  // #### RUNTIME #############################################################
  runtimeOnly "org.postgresql:postgresql"
  runtimeOnly "org.flywaydb:flyway-database-postgresql"

  // #### IMPL ################################################################
  implementation "org.springframework.boot:spring-boot-starter-web"
  implementation "org.springframework.boot:spring-boot-starter-actuator"
  implementation "org.springframework.boot:spring-boot-starter-data-jpa"
  implementation "org.springframework.boot:spring-boot-starter-validation"
  implementation "org.springframework.boot:spring-boot-starter-flyway"
  implementation "jakarta.persistence:jakarta.persistence-api"
  implementation "jakarta.validation:jakarta.validation-api"
  implementation "org.flywaydb:flyway-core"
  implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"
  implementation libs.semver4j

  // #### TEST ################################################################
  testImplementation "org.springframework.boot:spring-boot-starter-test"
  testImplementation libs.testcontainers.postgresql
  testImplementation libs.testcontainers.junit
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"

  // #### Lombok and MapStruct ################################################
  // #### Note the order — therefore in a block of its own ####################
  annotationProcessor libs.lombok
  compileOnly libs.lombok
  annotationProcessor libs.lombok.mapstruct.binding
  annotationProcessor libs.mapstruct.processor
  implementation libs.mapstruct
  testCompileOnly libs.lombok
  testAnnotationProcessor libs.lombok

  // #### DEV #################################################################
  developmentOnly "org.springframework.boot:spring-boot-devtools"
}

// ###########################################################
// #### Translations (Tolgee)
// #### ./gradlew :core:pullTranslations
// #### ./gradlew :core:verifyTranslations
// ###########################################################
// Instance and project come from the environment, never from this repository.
// verifyTranslations needs neither, so `check` stays green without them.
tolgee {
  //// Environment first, then ~/.gradle/gradle.properties.
  url = providers.environmentVariable("VC_TOLGEE_URL").orElse(providers.gradleProperty("vcTolgeeUrl"))
  projectId = providers.environmentVariable("VC_TOLGEE_PROJECT_ID")
                       .orElse(providers.gradleProperty("vcTolgeeProjectId"))
                       .map { Integer.parseInt(it) }
  //// Which keys this artifact consumes — a property of the module.
  tag = "core"
  languages = ["de", "en"]
  outputDir = layout.projectDirectory.dir("src/main/resources/messages")
  fallbackLanguage = "en"
  //// The variable's name, never the token.
  apiKeyEnv = "VC_TOLGEE_API_KEY"
}

// Verification is offline and cheap, so it runs with `check`. The download stays
// manual — an ordinary build must not need the network.
tasks.named("check") {
  dependsOn tasks.named("verifyTranslations")
}
