plugins {
  id "java"
  alias(libs.plugins.spring.boot)
  alias(libs.plugins.spring.dependency.management)
  alias(libs.plugins.epicsoft.tolgee)
}

description = "Version Control backend"

base {
  archivesName = "vc-core"
}

// Only the executable jar, no plain one. Spring Boot builds both by default, and
// `ls vc-core-*.jar` then finds "vc-core-<version>-plain.jar" first — the hyphen
// sorts before the dot. The image would start and fail with "no main manifest
// attribute", which says nothing about the actual cause.
tasks.named("jar") {
  enabled = false
}

java {
  sourceCompatibility = JavaVersion.VERSION_25
  targetCompatibility = JavaVersion.VERSION_25
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

dependencies {
  // #### RUNTIME #############################################################
  runtimeOnly "org.postgresql:postgresql"
  runtimeOnly "org.flywaydb:flyway-database-postgresql"

  // #### IMPL ################################################################
  implementation "org.springframework.boot:spring-boot-starter-web"
  implementation "org.springframework.boot:spring-boot-starter-actuator"
  implementation "org.springframework.boot:spring-boot-starter-data-jpa"
  implementation "org.springframework.boot:spring-boot-starter-validation"
  implementation "org.springframework.boot:spring-boot-starter-flyway"
  implementation "jakarta.persistence:jakarta.persistence-api"
  implementation "jakarta.validation:jakarta.validation-api"
  implementation "org.flywaydb:flyway-core"
  implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"
  implementation libs.semver4j

  // #### TEST ################################################################
  testImplementation "org.springframework.boot:spring-boot-starter-test"
  testImplementation libs.testcontainers.postgresql
  testImplementation libs.testcontainers.junit
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"

  // #### Lombok and MapStruct ################################################
  // #### Note the order — therefore in a block of its own ####################
  annotationProcessor libs.lombok
  compileOnly libs.lombok
  annotationProcessor libs.lombok.mapstruct.binding
  annotationProcessor libs.mapstruct.processor
  implementation libs.mapstruct
  testCompileOnly libs.lombok
  testAnnotationProcessor libs.lombok

  // #### DEV #################################################################
  developmentOnly "org.springframework.boot:spring-boot-devtools"
}

// ###########################################################
// #### Translations (Tolgee)
// #### ./gradlew :core:pullTranslations
// #### ./gradlew :core:verifyTranslations
// ###########################################################
//// Instance and project come from the environment — nothing about them is
//// stored in this repository. Without the variables `pullTranslations` reports
//// which one is missing; `verifyTranslations` needs neither and keeps working,
//// so `check` stays green for everyone.
tolgee {
  //// Environment first, then ~/.gradle/gradle.properties (vcTolgeeUrl,
  //// vcTolgeeProjectId) — the workstation keeps this outside every repository.
  url = providers.environmentVariable("VC_TOLGEE_URL").orElse(providers.gradleProperty("vcTolgeeUrl"))
  projectId = providers.environmentVariable("VC_TOLGEE_PROJECT_ID")
                       .orElse(providers.gradleProperty("vcTolgeeProjectId"))
                       .map { Integer.parseInt(it) }
  //// Which keys belong to this artifact — a property of the module, not of the
  //// environment, so it stays here. The dashboard keeps its own the same way.
  tag = "core"
  languages = ["de", "en"]
  outputDir = layout.projectDirectory.dir("src/main/resources/messages")
  fallbackLanguage = "en"
  //// Only the *name* of the variable — never the token itself.
  apiKeyEnv = "VC_TOLGEE_API_KEY"
}

// The plugin wires nothing into the lifecycle on its own — that is this
// project's call. Verification is offline and cheap, so it runs with `check`;
// the download stays manual so an ordinary build never needs the network.
tasks.named("check") {
  dependsOn tasks.named("verifyTranslations")
}
